name: Publish Docker image

# Runs after CI is green on main, so a build that does not compile or a failing test never
# reaches GHCR.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit CI actually validated, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Deliberately `amtarc-site`, not `amtarc-web`: the old Next.js repo publishes
      # ghcr.io/<owner>/amtarc-web, and the live stack pulls that tag. Publishing under the same
      # name from here would overwrite the running site's image.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          cache-from: type=gha,scope=amtarc-site
          cache-to: type=gha,mode=max,scope=amtarc-site
          tags: |
            ghcr.io/${{ github.repository_owner }}/amtarc-site:latest
            ghcr.io/${{ github.repository_owner }}/amtarc-site:${{ github.event.workflow_run.head_sha }}
