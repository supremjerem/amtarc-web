# Local development: PostgreSQL only. The app runs on the host via `dotnet run`.
# The production stack (app + postgres behind Traefik) lands in Phase 8.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amtarc
      POSTGRES_PASSWORD: amtarc
      POSTGRES_DB: amtarc
    # 5434 on the host: the old Next/Nest repo still runs its own Postgres on 5432
    # while the two stacks coexist during the rewrite.
    ports:
      - '5434:5432'
    volumes:
      - amtarc_pg_data:/var/lib/postgresql/data

volumes:
  amtarc_pg_data:
