# Local development: PostgreSQL only. The app runs on the host via `dotnet run`.
# The production stack (app + postgres behind Traefik) lands in Phase 8.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amtarc
      POSTGRES_PASSWORD: amtarc
      POSTGRES_DB: amtarc
    ports:
      - '5432:5432'
    volumes:
      - amtarc_pg_data:/var/lib/postgresql/data

volumes:
  amtarc_pg_data:
